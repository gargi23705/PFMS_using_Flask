{% extends "layout.html" %}
{% block body %}

<div class="container mt-4 text-light">

    <h2>Add Salary</h2>

    <form action="" method="POST" class="mt-3">

        <div class="form-group mb-3">
            <label for="salary_amount">Salary Amount</label>
            <input
                type="number"
                step="0.01"
                name="salary_amount"
                id="salary_amount"
                class="form-control"
                placeholder="Enter monthly salary"
                required
            >
        </div>

        <button type="submit" class="btn btn-success">
            Save Salary
        </button>

        <a href="/addTransactions" class="btn btn-secondary">
            Back
        </a>

    </form>

</div>

{% endblock %}
