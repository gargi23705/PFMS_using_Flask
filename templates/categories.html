{% extends 'layout.html' %}
{% block body %}
<div class="container mt-4 text-light">

    <h3>Manage Categories</h3>

    <form action="{{ url_for('addCategory') }}" method="POST" class="d-flex mt-2">
        <input type="text" name="category_name" placeholder="Add Category" class="form-control" required>
        <button type="submit" class="btn btn-success ml-2">Add</button>
    </form>

    <table class="table table-dark table-hover mt-3">
        <thead>
            <tr>
                <th>Category</th>
                <th style="width: 120px;">Delete</th>
            </tr>
        </thead>
        <tbody>
        {% for c in categories %}
            <tr>
                <td>{{ c.category_name }}</td>
                <td>
                    <form action="{{ url_for('deleteCategory', id=c.id) }}" method="POST">
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
